    <!-- GitHub Pages SPA routing: restore path from 404.html redirect -->
    <script>
      (function () {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
        // Handle the ?p= query param set by 404.html
        var l = window.location;
        if (l.search[1] === 'p' && l.search.indexOf('p=/') === 1) {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) { return s.split('='); })
            .reduce(function (m, s) {
              m[decodeURIComponent(s[0])] = s[1]
                ? decodeURIComponent(s[1].replace(/\+/g, ' '))
                : '';
              return m;
            }, {});
          var newUrl =
            l.pathname.slice(0, -1) +
            (decoded.p || '/') +
            (decoded.q ? '?' + decoded.q : '') +
            l.hash;
          history.replaceState(null, null, newUrl);
        }
      })();
    </script>
