<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>NBE Policy Management System</title>
    <script>
      // GitHub Pages SPA routing fix.
      // When GitHub Pages serves a 404 for a deep link (e.g. /policies/123),
      // this page redirects to the root with the path encoded as a query param.
      // index.html then decodes it and restores the URL via replaceState.
      // See: https://github.com/rafgraph/spa-github-pages
      var segmentCount = 1; // number of path segments in the repo name (1 for /NBE-Policy-Rules-Lifecycle)
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + segmentCount)
            .join('/') +
          '/?p=/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(segmentCount)
            .join('/') +
          (l.search ? '&q=' + l.search.slice(1) : '') +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
